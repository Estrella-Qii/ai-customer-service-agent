name: Bug report
description: Report a reproducible defect in the API, Web UI, RAG flow, or deployment.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, real customer data, or private knowledge-base content.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, endpoint payload shape, and sanitized logs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Docker Compose
        - Local Python with Docker dependencies
        - Other self-hosted setup
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant checks
      description: Share sanitized /health/ready output and test results where relevant.
